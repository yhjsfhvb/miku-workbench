<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miku Workbench - 登录</title>
<link rel="stylesheet" href="/static/style.css?v=20260831">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
.login-page {
  display:flex; align-items:center; justify-content:center;
  min-height:100vh; padding:20px;
}
.login-card {
  width:400px; max-width:90vw;
  background:rgba(255,255,255,0.45);
  backdrop-filter:blur(20px) saturate(1.5); -webkit-backdrop-filter:blur(20px) saturate(1.5);
  border-radius:28px; padding:40px 36px;
  box-shadow:0 20px 60px rgba(0,0,0,0.15), 0 4px 12px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.6);
  border:1px solid rgba(255,255,255,0.5);
  position:relative; overflow:hidden;
}
.login-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:6px;
  background:linear-gradient(90deg,var(--miku-cyan),var(--miku-pink),var(--miku-purple));
}
.login-logo {
  display:flex; flex-direction:column; align-items:center; margin-bottom:28px;
}
.login-logo .miku-avatar {
  width:80px; height:80px; border-radius:50%;
  background:linear-gradient(135deg,var(--miku-cyan),var(--miku-cyan-light));
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 8px 24px rgba(57,197,187,0.3);
  margin-bottom:14px;
  animation:mikuBounce 3s ease-in-out infinite;
}
@keyframes mikuBounce {
  0%,100% { transform:translateY(0); }
  50% { transform:translateY(-6px); }
}
.login-logo h1 {
  font-size:26px; font-weight:700; color:var(--miku-cyan-dark);
  letter-spacing:-0.5px;
}
.login-logo h1 span { color:var(--miku-purple); margin-left:4px; }
.login-logo p { font-size:13px; color:#999; margin-top:4px; }
.login-field { margin-bottom:18px; }
.login-field label {
  display:block; font-size:13px; font-weight:600; color:#666; margin-bottom:6px;
}
.login-field .input-wrap {
  position:relative;
}
.login-field input {
  width:100%; padding:12px 16px 12px 42px;
  border:1.5px solid rgba(255,255,255,0.5); border-radius:14px;
  font-size:15px; font-family:var(--font); background:rgba(255,255,255,0.35);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  transition:all 0.25s; outline:none; color:#333;
}
.login-field input:focus {
  border-color:var(--miku-cyan); background:rgba(255,255,255,0.55);
  box-shadow:0 0 0 4px rgba(57,197,187,0.1);
}
.login-field .input-icon {
  position:absolute; left:14px; top:50%; transform:translateY(-50%);
  font-size:16px; color:#bbb;
}
.login-error {
  background:rgba(231,76,60,0.08); color:#e74c3c;
  font-size:13px; padding:10px 14px; border-radius:12px;
  margin-bottom:16px; display:none;
  border:1px solid rgba(231,76,60,0.15);
}
.login-error.show { display:block; animation:shake 0.4s; }
@keyframes shake {
  0%,100% { transform:translateX(0); }
  25% { transform:translateX(-6px); }
  75% { transform:translateX(6px); }
}
.btn-login {
  width:100%; padding:14px; border:none; border-radius:14px;
  font-size:16px; font-weight:700; color:#fff; cursor:pointer;
  font-family:var(--font);
  background:linear-gradient(135deg,var(--miku-cyan),var(--miku-cyan-light));
  box-shadow:0 8px 20px rgba(57,197,187,0.3);
  transition:all 0.25s; margin-top:6px;
}
.btn-login:hover { transform:translateY(-2px); box-shadow:0 12px 28px rgba(57,197,187,0.35); }
.btn-login:active { transform:translateY(0); }
.login-hint {
  text-align:center; margin-top:20px; font-size:12px; color:#bbb;
}
.login-hint code {
  background:rgba(57,197,187,0.08); color:var(--miku-cyan-dark);
  padding:2px 8px; border-radius:6px; font-size:12px;
}
.login-deco {
  display:flex; justify-content:center; gap:8px; margin-top:24px;
}
.login-deco span { font-size:16px; opacity:0.4; animation:floatDeco 4s ease-in-out infinite; }
.login-deco span:nth-child(2) { animation-delay:0.5s; }
.login-deco span:nth-child(3) { animation-delay:1s; }
@keyframes floatDeco { 0%,100% { opacity:0.3; } 50% { opacity:0.6; } }
</style>
</head>
<body>
<div class="bg-gradient"></div>
<div class="bg-bokeh"></div>
<div class="floating-deco">
  <span class="deco star" style="top:8%;left:12%;animation-delay:0s">&#10022;</span>
  <span class="deco note" style="top:20%;right:15%;animation-delay:1.5s">&#9834;</span>
  <span class="deco heart" style="top:45%;left:5%;animation-delay:0.8s">&#9829;</span>
  <span class="deco star" style="bottom:15%;right:8%;animation-delay:2s">&#10022;</span>
  <span class="deco note" style="bottom:30%;left:18%;animation-delay:2.5s">&#9834;</span>
</div>

<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="miku-avatar">
        <svg viewBox="0 0 100 100" width="44" height="44">
          <path d="M35 28 Q35 18 42 20 Q48 15 52 22 Q58 16 65 25 Q70 28 68 35 Q72 40 65 48 L65 55 Q60 58 50 58 Q40 58 35 55 L35 48 Q28 40 32 35 Q30 32 35 28Z" fill="#fff" opacity="0.9"/>
          <circle cx="44" cy="40" r="2.5" fill="#39C5BB"/><circle cx="56" cy="40" r="2.5" fill="#39C5BB"/>
          <path d="M46 48 Q50 52 54 48" stroke="#39C5BB" stroke-width="1.5" fill="none"/>
          <rect x="38" y="55" width="24" height="18" rx="3" fill="#fff" opacity="0.5"/>
        </svg>
      </div>
      <h1>Miku<span>Workbench</span></h1>
      <p>初音工作台 · 欢迎回来</p>
    </div>

    <div class="login-error" id="loginError"></div>

    <form id="loginForm" onsubmit="return false;">
      <div class="login-field">
        <label>用户名</label>
        <div class="input-wrap">
          <span class="input-icon">&#9679;</span>
          <input type="text" id="loginUser" placeholder="输入用户名" autocomplete="username" value="">
        </div>
      </div>
      <div class="login-field">
        <label>密码</label>
        <div class="input-wrap">
          <span class="input-icon">&#128274;</span>
          <input type="password" id="loginPass" placeholder="输入密码" autocomplete="current-password" value="">
        </div>
      </div>
      <button class="btn-login" id="btnLogin" type="submit">登 录</button>
    </form>

    <div class="login-deco">
      <span>&#9834;</span><span>&#10022;</span><span>&#9835;</span>
    </div>
  </div>
</div>

<script>
document.getElementById('btnLogin').addEventListener('click', async () => {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const errBox = document.getElementById('loginError');
  const btn = document.getElementById('btnLogin');

  if (!username || !password) {
    errBox.textContent = '请输入用户名和密码';
    errBox.classList.add('show');
    return;
  }

  btn.textContent = '登录中...';
  btn.disabled = true;
  errBox.classList.remove('show');

  try {
    const resp = await fetch('/api/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username, password})
    });
    const data = await resp.json();
    if (resp.ok && data.success) {
      btn.textContent = '登录成功 ♪';
      setTimeout(() => { window.location.href = '/'; }, 600);
    } else {
      errBox.textContent = data.error || '登录失败';
      errBox.classList.add('show');
      btn.textContent = '登 录';
      btn.disabled = false;
    }
  } catch(e) {
    errBox.textContent = '网络错误，请重试';
    errBox.classList.add('show');
    btn.textContent = '登 录';
    btn.disabled = false;
  }
});

document.getElementById('loginPass').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('btnLogin').click();
});
document.getElementById('loginUser').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('loginPass').focus();
});
</script>
</body>
</html>
